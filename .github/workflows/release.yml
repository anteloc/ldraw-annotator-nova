# Push a tag like v0.1.0: tests run, then the wheel and the LDraw info DB are attached to a
# GitHub release of that tag (created if it doesn't exist).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test
      - run: uv run pytest
      - run: uv build --wheel
      - name: Upload the wheel and the DB to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl data/ldraw-info.db --clobber
